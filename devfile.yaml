schemaVersion: 2.2.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: todo-app
components:
- name: dev-tools
  container:
    image: quay.io/devfile/universal-developer-image:ubi9-latest
    memoryRequest: 512Mi # optional
    memoryLimit: 2Gi # optional
    cpuRequest: 100m # optional
    cpuLimit: 4000m # optional
    mountSources: true
    env:
    - name: PORT
      value: '3000'
    - name: POSTGRES_USER
      value: postgres
    - name: POSTGRES_PASSWORD
      value: password
    - name: POSTGRES_HOST
      value: localhost
    - name: POSTGRES_DB
      value: todoapp
    - name: POSTGRES_PORT
      value: '5432'
    endpoints:
    - name: todo-app
      targetPort: 3000
      exposure: public
      protocol: https
- name: che-code
    container:
      # This image matches the default VS Code editor in Dev Spaces
      image: quay.io/che-incubator/che-code:latest
      env:
        # THE FIX: Whitelist the Azure Account extension ID
        - name: VSCODE_TRUSTED_EXTENSIONS
          value: '["ms-vscode.azure-account","ms-azuretools.vscode-azureresourcegroups","ms-vscode.azure-devops"]'
      volumeMounts:
        - name: checode-volume
          path: /checode
commands:
  - id: login-azure
    exec:
      component: tools
      commandLine: "az login --use-device-code"
      workingDir: /projects

